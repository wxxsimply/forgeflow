global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: operations-webhook
      matchers:
        - severity="critical"
      repeat_interval: 30m

receivers:
  - name: operations-webhook
    webhook_configs:
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true
        max_alerts: 20
        timeout: 10s

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname]
